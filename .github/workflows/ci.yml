name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Security Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/intelligence-api/requirements.txt
          pip install ruff bandit pytest pytest-asyncio anyio

      - name: Secret Scanning Audit
        run: |
          python scripts/scan_tracked_secrets.py

      - name: Lint with Ruff
        run: |
          ruff check apps/intelligence-api/app --select E,F,W --ignore E501

      - name: Static Security Analysis with Bandit
        run: |
          bandit -r apps/intelligence-api/app -ll -x "apps/intelligence-api/tests,**/__pycache__"

      - name: Run Pytest Suite
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          DISCOVERY_PROVIDER: mock
          OUTREACH_DRY_RUN: "true"
          AGENCY_NAME: "CI Agency"
          AGENCY_SENDER_NAME: "CI Tester"
          TELEGRAM_ALLOWED_USER_ID: "123456789"
          PYTHONPATH: apps/intelligence-api
        run: |
          pytest apps/intelligence-api/tests -v --maxfail=5

      - name: Validate Docker Compose Configurations
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
