<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IntentLead AI Operator{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --warning: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .banner {
      background-color: #78350f;
      color: #fef3c7;
      text-align: center;
      padding: 0.6rem 1rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 1px solid #b45309;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      margin-left: 1.5rem;
    }
    nav a.brand {
      margin-left: 0;
      font-size: 1.25rem;
      color: var(--primary);
    }
    nav a:hover {
      color: var(--primary);
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: var(--primary);
      color: #0f172a;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-a { background-color: #065f46; color: #a7f3d0; }
    .badge-b { background-color: #1e40af; color: #bfdbfe; }
    .badge-c { background-color: #854d0e; color: #fef08a; }
    .badge-d { background-color: #991b1b; color: #fecaca; }
    pre {
      background-color: #090d16;
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="banner">Dry-run mode. Outreach is disabled.</div>
  <nav>
    <a href="/" class="brand">IntentLead AI</a>
    <div>
      <a href="/">Campaigns</a>
      <a href="/campaigns/new" class="btn">+ New Campaign</a>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
