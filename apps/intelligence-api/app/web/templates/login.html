<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Login — IntentLead AI</title>
  <link rel="stylesheet" href="/static/css/intentlead.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      box-shadow: 4px 4px 0px #0F172A;
      padding: 2.25rem;
      border-radius: 4px;
    }
    .login-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .login-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      margin-bottom: 0.5rem;
    }
    .login-sub {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 0.875rem;
      font-size: 0.925rem;
      font-family: var(--font-body);
      border: 1.5px solid var(--border-color);
      background: #FFFFFF;
      border-radius: 2px;
      outline: none;
      transition: all 0.15s ease;
    }
    .form-input:focus {
      border-color: #0F172A;
      box-shadow: 2px 2px 0px #0F172A;
    }
    .alert-banner {
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border-color);
      margin-bottom: 1.25rem;
      border-radius: 2px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .alert-danger {
      background: var(--accent-red-tint);
      color: #991B1B;
      border-color: #F87171;
    }
    .btn-login {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: #0F172A;
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 600;
      border: 1.5px solid #0F172A;
      box-shadow: 2px 2px 0px var(--accent-lime);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .btn-login:hover {
      background: #1E293B;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--accent-lime);
    }
    .login-footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border-subtle);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-subtle);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body class="engineering-grid">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand">
          <span style="color: #65A30D; font-size: 1.6rem; line-height: 1;">⚡</span>
          <span>IntentLead <span style="font-weight: 300; color: #64748B;">AI</span></span>
        </div>
        <p class="login-sub">Operator Authentication & Command Center Access</p>
      </div>

      {% if error %}
        <div class="alert-banner alert-danger" role="alert">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form action="/login" method="post" autocomplete="on">
        <input type="hidden" name="next" value="{{ next_url or '/' }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">

        <div class="form-group">
          <label class="form-label" for="username">Operator Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="admin"
            required
            autofocus
            value="{{ username or '' }}"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••••••"
            required
          >
        </div>

        <button type="submit" class="btn-login">
          <span>Authenticate & Enter</span>
          <span>→</span>
        </button>
      </form>

      <div class="login-footer">
        <div>SECURE OPERATOR INTERFACE</div>
        <div style="margin-top: 0.25rem;">PBKDF2-HMAC-SHA256 • HttpOnly Session • Rate Limited</div>
      </div>
    </div>
  </div>
</body>
</html>
