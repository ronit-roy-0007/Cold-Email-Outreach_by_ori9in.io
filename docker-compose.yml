services:
  db:
    image: postgres:16-alpine
    container_name: intentlead-db
    environment:
      POSTGRES_USER: intentlead
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: intentlead
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentlead -d intentlead"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/intelligence-api
      dockerfile: Dockerfile
    container_name: intentlead-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://intentlead:change-me@db:5432/intentlead
      DISCOVERY_PROVIDER: mock
      GOOGLE_MAPS_SCRAPER_BASE_URL: http://scraper:8080
      OUTREACH_DRY_RUN: "true"
      AGENCY_NAME: "ori9in.io"
      AGENCY_SENDER_NAME: "Ronit"
      API_KEY: ""
      RATE_LIMIT_PER_MINUTE: "60"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
