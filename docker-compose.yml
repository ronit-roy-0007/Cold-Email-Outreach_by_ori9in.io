services:
  db:
    image: postgres:16-alpine
    container_name: intentlead-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intentlead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intentlead_secure_staging_pass}
      POSTGRES_DB: ${POSTGRES_DB:-intentlead}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intentlead} -d ${POSTGRES_DB:-intentlead}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intentlead-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/intelligence-api
      dockerfile: Dockerfile
    container_name: intentlead-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgresql://${POSTGRES_USER:-intentlead}:${POSTGRES_PASSWORD:-intentlead_secure_staging_pass}@db:5432/${POSTGRES_DB:-intentlead}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DISCOVERY_PROVIDER: ${DISCOVERY_PROVIDER:-mock}
      GOOGLE_MAPS_SCRAPER_BASE_URL: ${GOOGLE_MAPS_SCRAPER_BASE_URL:-http://scraper:8080}
      OUTREACH_DRY_RUN: ${OUTREACH_DRY_RUN:-true}
      AGENCY_NAME: ${AGENCY_NAME:-ori9in.io}
      AGENCY_SENDER_NAME: ${AGENCY_SENDER_NAME:-Ronit}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      OUTREACH_WEBHOOK_SECRET: ${OUTREACH_WEBHOOK_SECRET:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      UNSUBSCRIBE_BASE_URL: ${UNSUBSCRIBE_BASE_URL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
