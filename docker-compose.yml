services:
  db:
    image: postgres:16-alpine
    container_name: intentlead-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intentlead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intentlead_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-intentlead}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intentlead} -d ${POSTGRES_DB:-intentlead}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intentlead-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intentlead-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-intentlead}:${POSTGRES_PASSWORD:-intentlead_dev_password}@db:5432/${POSTGRES_DB:-intentlead}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OUTREACH_DRY_RUN: ${OUTREACH_DRY_RUN:-true}
    ports:
      - "${API_BIND_IP:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  telegram-poller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intentlead-telegram-poller
    restart: unless-stopped
    command: ["python", "scripts/telegram_poller.py"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-intentlead}:${POSTGRES_PASSWORD:-intentlead_dev_password}@db:5432/${POSTGRES_DB:-intentlead}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OUTREACH_DRY_RUN: ${OUTREACH_DRY_RUN:-true}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intentlead-worker
    restart: unless-stopped
    command: ["python", "scripts/worker.py"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-intentlead}:${POSTGRES_PASSWORD:-intentlead_dev_password}@db:5432/${POSTGRES_DB:-intentlead}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OUTREACH_DRY_RUN: ${OUTREACH_DRY_RUN:-true}

volumes:
  postgres_data:
  redis_data:
